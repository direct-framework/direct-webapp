name: Feature proposal (developers)
description: For maintainers and contributors with write access. Members of the public, please use "Feature request".
labels: [feature]
body:
  - type: textarea
    attributes:
      label: Description and motivation
      description: A clear and concise description of what you plan to do and why it's needed.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed approach
      description: Describe your planned approach, if known.
    validations:
      required: false
  - type: textarea
    attributes:
      label: Acceptance criteria
      description: What must be true for this work to be considered done?
      placeholder: |
        - [ ] ...
    validations:
      required: false
  - type: textarea
    attributes:
      label: Affected areas
      description: Which parts of the codebase are affected (e.g., models, views, templates, docs)?
    validations:
      required: false
  - type: textarea
    attributes:
      label: Additional context
      description: Add any other context, diagrams, or references here.
    validations:
      required: false
