<!DOCTYPE html>
<!-- Three assessment-navigation layouts, switchable with ?variant=A|B|C. Fictional data. -->
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description"
              content="Prototype of Role and Speciality selections and guided self-assessment.">
        <title>PROTOTYPE - Personal selections and assessment</title>
        <style>
      :root {
        color-scheme: light;
        --ink: #243746;
        --muted: #647583;
        --line: #d7e0e5;
        --paper: #fff;
        --canvas: #f2f5f7;
        --blue: #185b83;
        --blue-light: #e8f2f8;
        --green: #27734c;
        --amber: #805c0a;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }
      body { margin: 0; color: var(--ink); background: var(--canvas); font-size: 15px; }
      button, input, select { font: inherit; }
      button, a { cursor: pointer; }
      a { color: var(--blue); }
      .site-header { background: #193b50; color: #fff; padding: 14px max(20px, calc((100% - 1180px) / 2)); }
      .site-header strong { font-size: 18px; letter-spacing: .02em; }
      .site-header span { float: right; opacity: .8; }
      .crumbs { max-width: 1180px; margin: 18px auto 10px; padding: 0 20px; color: var(--muted); font-size: 13px; }
      .shell { max-width: 1180px; margin: 0 auto 100px; padding: 0 20px; }
      .prototype-note { padding: 10px 14px; margin: 0 0 16px; border-left: 4px solid #d59d2d; background: #fff7e2; color: #58430f; }
      .page-heading { margin: 0 0 5px; font-size: 30px; }
      .lede { color: var(--muted); margin: 0 0 22px; max-width: 780px; line-height: 1.5; }
      .card { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 20px; }
      .card + .card { margin-top: 16px; }
      .card h2, .card h3 { margin: 0 0 12px; }
      .card h2 { font-size: 21px; }
      .card h3 { font-size: 17px; }
      .muted { color: var(--muted); }
      .small { font-size: 13px; }
      .toolbar { display: flex; flex-wrap: wrap; align-items: end; gap: 12px; margin-bottom: 16px; }
      .toolbar label, .field-label { display: block; font-size: 13px; font-weight: 650; margin-bottom: 5px; }
      select, input[type="search"] { padding: 9px 10px; border: 1px solid #aebdc6; border-radius: 5px; background: #fff; color: var(--ink); }
      .scenario { min-width: 260px; }
      .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 9px 14px; border: 1px solid var(--blue); border-radius: 5px; background: var(--blue); color: #fff; font-weight: 650; text-decoration: none; }
      .btn.secondary { background: #fff; color: var(--blue); }
      .btn.tertiary { border-color: transparent; background: transparent; color: var(--blue); padding-inline: 5px; }
      .btn:focus-visible, button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid #e6b842; outline-offset: 2px; }
      .chips { display: flex; flex-wrap: wrap; gap: 7px; margin: 8px 0 0; }
      .chip { display: inline-flex; padding: 4px 9px; border: 1px solid #8eacbd; border-radius: 99px; background: #f3f8fb; color: #234e67; font-size: 12px; }
      .choice-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .choice-group { border: 1px solid var(--line); border-radius: 6px; padding: 14px; }
      .choice-group h3 { margin: 0 0 10px; }
      .choice { display: flex; gap: 9px; align-items: flex-start; padding: 8px 0; border-top: 1px solid #edf1f3; }
      .choice input { margin-top: 3px; accent-color: var(--blue); }
      .choice small { display: block; margin-top: 2px; color: var(--muted); }
      .group-parent { margin: 14px 0 6px; padding: 8px 9px; border-radius: 4px; background: #edf3f6; font-weight: 700; }
      .group-parent small { display: block; color: var(--muted); font-size: 11px; font-weight: 500; text-transform: uppercase; }
      .domain-link { display: block; width: calc(100% - 12px); margin: 2px 0 2px 12px; padding: 8px 10px; border: 0; border-left: 2px solid #b7c8d1; background: #fff; color: var(--ink); text-align: left; }
      .domain-link[aria-current="page"] { border-left: 4px solid var(--blue); background: var(--blue-light); font-weight: 700; }
      .group-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px; }
      .group-tabs button { padding: 9px 12px; border: 1px solid #9aadb8; border-radius: 5px 5px 0 0; background: #f4f7f8; color: var(--ink); }
      .group-tabs button[aria-current="true"] { border-bottom: 3px solid var(--blue); background: #fff; font-weight: 700; }
      .domain-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px 14px; padding: 8px; border-left: 3px solid #9aadb8; background: #f7f9fa; }
      .domain-tabs button { padding: 7px 10px; border: 1px solid #b6c4cb; border-radius: 4px; background: #fff; color: var(--ink); }
      .domain-tabs button[aria-current="page"] { border-color: var(--blue); background: var(--blue-light); font-weight: 700; }
      .inline-actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 16px; }
      .notice { padding: 11px 13px; border-radius: 5px; background: var(--blue-light); margin: 12px 0; line-height: 1.45; }
      .notice.empty { background: #fff5dc; color: #5e490f; }
      .notice.success { background: #e8f5ed; color: #20583b; }
      .layout { display: grid; gap: 16px; }
      .layout-a { grid-template-columns: 220px minmax(0, 1fr); align-items: start; }
      .layout-b { grid-template-columns: 260px minmax(0, 1fr); align-items: start; }
      .layout-c { grid-template-columns: minmax(0, 1fr); align-items: start; }
      .side-nav { position: sticky; top: 16px; }
      .side-nav button, .page-tabs button { width: 100%; padding: 10px 12px; text-align: left; border: 0; border-radius: 4px; background: transparent; color: var(--ink); }
      .side-nav button[aria-current="page"], .page-tabs button[aria-current="page"] { background: var(--blue-light); color: #123f5c; font-weight: 700; }
      .page-tabs { display: flex; flex-wrap: wrap; gap: 5px; border-bottom: 1px solid var(--line); padding-bottom: 10px; margin-bottom: 14px; }
      .page-tabs button { width: auto; }
      .assessment-tools { display: flex; align-items: center; gap: 16px; margin: 0 0 16px; }
      .assessment-tools > div { flex: 1; }
      .assessment-tools .progress { max-width: 430px; margin: 6px 0 3px; }
      .assessment-tools .btn { flex: 0 0 auto; }
      .step { display: flex; gap: 8px; align-items: center; color: var(--muted); margin-bottom: 18px; }
      .step strong { color: var(--blue); }
      .step-dot { display: inline-grid; place-items: center; width: 25px; height: 25px; border: 1px solid var(--line); border-radius: 50%; background: #fff; }
      .step-dot.active { background: var(--blue); color: #fff; border-color: var(--blue); }
      .skill-table { width: 100%; border-collapse: collapse; }
      .skill-table th, .skill-table td { border-bottom: 1px solid #e8edef; padding: 11px 8px; text-align: left; vertical-align: top; }
      .skill-table th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
      .skill-table select { min-width: 145px; }
      .association { display: block; margin-top: 4px; font-size: 11px; color: var(--muted); }
      .page-title { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
      .progress { height: 7px; overflow: hidden; border-radius: 10px; background: #e5ebee; margin: 15px 0; }
      .progress span { display: block; height: 100%; background: #4a9a70; }
      .summary-list { margin: 0; padding-left: 18px; line-height: 1.8; }
      .state-panel { border: 1px dashed #91a7b3; border-radius: 6px; padding: 12px; background: #f8fafb; }
      .state-panel h3 { font-size: 14px; margin: 0 0 7px; }
      .bottom-switcher { position: fixed; z-index: 20; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; align-items: center; gap: 14px; padding: 7px 10px; border: 1px solid #243746; border-radius: 99px; background: #132d3d; color: #fff; box-shadow: 0 4px 18px #172c3a55; }
      .bottom-switcher button { width: 34px; height: 34px; border: 0; border-radius: 50%; background: #fff; color: #132d3d; font-size: 20px; }
      .switch-label { min-width: 150px; text-align: center; font-size: 12px; }
      .footer-note { color: var(--muted); font-size: 12px; padding: 14px 0; }
      .review-tools { max-width: 1180px; margin: 18px auto; padding: 18px 20px; border: 3px solid #a34a15; border-radius: 8px; background: #fff3e8; }
      .review-tools h1 { margin: 0 0 8px; font-size: 24px; color: #71320e; }
      .review-tools h2 { margin: 16px 0 8px; font-size: 17px; }
      .review-tools p { max-width: 900px; line-height: 1.45; }
      .review-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; }
      .review-options { display: grid; gap: 8px; }
      .review-options button { padding: 10px; text-align: left; border: 1px solid #b87c57; border-radius: 5px; background: #fff; color: var(--ink); }
      .review-options button[aria-pressed="true"] { border: 2px solid #71320e; background: #fce1cd; font-weight: 700; }
      .candidate-frame { margin: 20px auto; max-width: 1240px; border: 4px solid var(--blue); border-radius: 10px; background: #fff; }
      .candidate-label { padding: 10px 20px; background: #e8f2f8; color: #123f5c; font-weight: 750; }
      .candidate-frame .shell { max-width: 1180px; }
      .bottom-switcher { gap: 10px; }
      .bottom-switcher .switch-label { min-width: 220px; }
      .bottom-switcher button { width: auto; min-width: 48px; padding: 0 10px; font-size: 13px; font-weight: 700; }
      @media (max-width: 760px) {
        .layout-a, .layout-b, .layout-c { grid-template-columns: 1fr; }
        .review-grid { grid-template-columns: 1fr; }
        .side-nav { position: static; }
        .side-nav button { display: inline-block; width: auto; }
        .choice-grid { grid-template-columns: 1fr; }
        .skill-table, .skill-table tbody, .skill-table tr, .skill-table td { display: block; width: 100%; }
        .skill-table thead { display: none; }
        .skill-table tr { padding: 10px 0; border-bottom: 1px solid var(--line); }
        .skill-table td { border: 0; padding: 4px 0; }
        .skill-table td:last-child { padding-top: 8px; }
        .page-heading { font-size: 25px; }
      }
        </style>
    </head>
    <body>
        <header class="site-header">
            <strong>DIRECT</strong><span>Framework&nbsp;&nbsp; Account v</span>
        </header>
        <div class="crumbs">Home / Self-assessment</div>
        <main id="review-tools" class="review-tools">
        </main>
        <section class="candidate-frame">
            <div class="candidate-label">CANDIDATE APP SCREEN - This bordered area is the design being reviewed. It is not in the live app.</div>
            <div id="app" class="shell"></div>
        </section>
        <div class="bottom-switcher" aria-label="Prototype layout switcher">
            <button id="previous"
                    type="button"
                    aria-label="Previous layout">Prev</button>
            <span class="switch-label" id="variant-label"></span>
            <button id="next" type="button" aria-label="Next layout">Next</button>
        </div>
        <script>
      const skills = [
        { id: "s1", name: "Document data processes", domain: "Research data practice", description: "Create clear records of how research data is handled.", roles: ["steward"], specialities: ["metadata"] },
        { id: "s2", name: "Apply metadata standards", domain: "Research data practice", description: "Select and apply appropriate metadata standards.", roles: ["steward"], specialities: ["metadata"] },
        { id: "s3", name: "Evaluate data quality", domain: "Data analysis", description: "Assess data for accuracy, completeness and consistency.", roles: ["analyst"], specialities: [] },
        { id: "s4", name: "Communicate findings", domain: "Data analysis", description: "Present findings for different audiences.", roles: ["analyst"], specialities: ["visualisation"] },
        { id: "s5", name: "Plan secure storage", domain: "Research data practice", description: "Choose storage suited to sensitivity and access needs.", roles: ["analyst"], specialities: ["security"] },
        { id: "s6", name: "Use a version-control workflow", domain: "Digital practice", description: "Track and review changes to shared work.", roles: [], specialities: [] },
      ];
      const roles = [
        { id: "steward", name: "Research Data Steward", detail: "Curated example Role" },
        { id: "analyst", name: "Research Data Analyst", detail: "Curated example Role" },
        { id: "emerging", name: "Emerging Research Role", detail: "No mapped competencies yet" },
      ];
      const specialities = [
        { id: "metadata", name: "Metadata Management" },
        { id: "visualisation", name: "Data Visualisation" },
        { id: "security", name: "Data Security" },
      ];
      const variantNames = { A: "Collapsible outline", B: "Always-open outline", C: "Selection + Domain tabs" };
      const variantDescriptions = {
        A: "A collapsible outline on the left. Each Role, Speciality, or Remaining Skills heading contains indented Domain pages.",
        B: "An always-open outline on the left. Every Role, Speciality, and Remaining Skills group and its Domain pages stay visible.",
        C: "A row of tabs for each Role, Speciality, and Remaining Skills group, with indented Domain tabs underneath."
      };
      const scenarioDescriptions = {
        overlap: "Starts with two Roles and one Speciality selected. Research Data Analyst spans two Domains; two Skills also appear in more than one selected section. Check that the parent selection and each nested Domain stay clear.",
        none: "Starts with no selections. The user should still see all Skills in Remaining Skills; one existing level is retained.",
        empty: "Selects a Role with no mapped Skills. Its empty state should explain that, while all Skills remain reachable.",
        changed: "Starts with a saved level for a Skill that is no longer relevant to the selected Role. That Skill should appear in Remaining Skills with its old level."
      };
      const levels = ["", "0 - None / N/A", "1 - Awareness", "2 - Working", "3 - Practitioner", "4 - Expert"];
      const app = document.querySelector("#app");
      const reviewTools = document.querySelector("#review-tools");
      const params = new URLSearchParams(location.search);
      let variant = ["A", "B", "C"].includes(params.get("variant")) ? params.get("variant") : "A";
      let scenario = "overlap";
      let selectedRoles = ["steward", "analyst"];
      let selectedSpecialities = ["metadata"];
      let pageIndex = -1;
      let returnPageIndex = 0;
      let assessmentStarted = false;
      let searchTerm = "";
      let assessments = { s1: "3", s2: "0", s3: "2", s4: "", s5: "", s6: "1" };
      let savedMessage = "";

      function setScenario(next) {
        scenario = next;
        pageIndex = -1;
        returnPageIndex = 0;
        assessmentStarted = false;
        searchTerm = "";
        savedMessage = "";
        if (next === "overlap") {
          selectedRoles = ["steward", "analyst"];
          selectedSpecialities = ["metadata"];
          assessments = { s1: "3", s2: "0", s3: "2", s4: "", s5: "", s6: "1" };
        } else if (next === "none") {
          selectedRoles = [];
          selectedSpecialities = [];
          assessments = { s1: "3", s2: "", s3: "", s4: "", s5: "", s6: "" };
        } else if (next === "empty") {
          selectedRoles = ["emerging"];
          selectedSpecialities = [];
          assessments = { s1: "", s2: "", s3: "", s4: "", s5: "", s6: "" };
        } else {
          selectedRoles = ["analyst"];
          selectedSpecialities = [];
          assessments = { s1: "4", s2: "", s3: "2", s4: "", s5: "", s6: "" };
        }
        render();
      }

      function allRelevantIds() {
        const ids = new Set();
        skills.forEach(skill => {
          if (skill.roles.some(id => selectedRoles.includes(id)) ||
              skill.specialities.some(id => selectedSpecialities.includes(id))) ids.add(skill.id);
        });
        return ids;
      }

      function pages() {
        const result = [];
        const addGroup = (kind, id, label, matching) => {
          const byDomain = new Map();
          matching.forEach(skill => {
            if (!byDomain.has(skill.domain)) byDomain.set(skill.domain, []);
            byDomain.get(skill.domain).push(skill);
          });
          if (!matching.length) result.push({ key: `${kind}-${id}`, groupKey: `${kind}-${id}`, kind, id, label, domain: "", items: [] });
          byDomain.forEach((items, domain) => result.push({ key: `${kind}-${id}-${domain}`, groupKey: `${kind}-${id}`, kind, id, label, domain, items }));
        };
        selectedRoles.forEach(id => addGroup("role", id, roles.find(x => x.id === id).name, skills.filter(skill => skill.roles.includes(id))));
        selectedSpecialities.forEach(id => addGroup("speciality", id, specialities.find(x => x.id === id).name, skills.filter(skill => skill.specialities.includes(id))));
        const relevant = allRelevantIds();
        addGroup("remaining", "all", "Remaining Skills", skills.filter(skill => !relevant.has(skill.id)));
        return result;
      }

      function otherAssociations(skill, current) {
        const names = [];
        skill.roles.filter(id => selectedRoles.includes(id) && current !== `role-${id}`).forEach(id => names.push(roles.find(x => x.id === id).name));
        skill.specialities.filter(id => selectedSpecialities.includes(id) && current !== `speciality-${id}`).forEach(id => names.push(specialities.find(x => x.id === id).name));
        return names;
      }

      function renderReviewTools() {
        return `<h1>PROTOTYPE CONTROLS - reviewer only</h1>
          <p><strong>Everything in this orange panel and the dark switcher at the bottom is for comparing options.</strong> Those controls are not part of the proposed DIRECT app. The blue-bordered area below is the candidate app screen for review; that design is also not implemented.</p>
          <div class="review-grid">
            <section><h2>1. Choose how the questionnaire is laid out</h2>
              <div class="review-options">
                ${["A", "B", "C"].map(key => `<button type="button" data-variant="${key}" aria-pressed="${variant === key}"><strong>${key} - ${variantNames[key]}</strong><br><span class="small">${variantDescriptions[key]}</span></button>`).join("")}
              </div>
            </section>
            <section><h2>2. Choose a sample situation to inspect</h2>
              <label class="field-label" for="scenario">This changes fictional saved data, not the layout</label>
              <select class="scenario" id="scenario">
                <option value="overlap" ${scenario === "overlap" ? "selected" : ""}>Two Roles + one Speciality overlap</option>
                <option value="none" ${scenario === "none" ? "selected" : ""}>No saved selections</option>
                <option value="empty" ${scenario === "empty" ? "selected" : ""}>Selected Role has no mapped Skills</option>
                <option value="changed" ${scenario === "changed" ? "selected" : ""}>Selection changed; keep an old assessment</option>
              </select>
              <p id="scenario-description" class="small">${scenarioDescriptions[scenario]}</p>
            </section>
          </div>
          <p><strong>What to do:</strong> Compare A, B and C in the blue-bordered area. The first page in every layout is where the person selects Roles and Specialities; continue to the grouped Skill sections. Tell me which navigation is clearest and what you would change.</p>`;
      }

      function selectionControls() {
        const checkGroup = (heading, items, selected, type) => `<section class="choice-group">
          <h3>${heading}</h3>
          ${items.map(item => `<label class="choice">
            <input type="checkbox" data-choice="${type}" value="${item.id}" ${selected.includes(item.id) ? "checked" : ""}>
            <span>${item.name}<small>${item.detail || (item.id === "metadata" ? "Focus independent of Role" : "Independent focus")}</small></span>
          </label>`).join("")}
        </section>`;
        return `<div class="choice-grid">
          ${checkGroup("Roles", roles, selectedRoles, "role")}
          ${checkGroup("Specialities", specialities, selectedSpecialities, "speciality")}
        </div>
        <p class="small muted">Selections are optional and independent. Revise them here before starting or later with Edit selections. They group the questionnaire; they do not limit access to Skills.</p>`;
      }

      function renderSelectionScreen() {
        return `<section class="card">
          <div class="step"><span class="step-dot active">1</span><strong>Selections</strong><span>then</span><span class="step-dot">2</span> Skill assessment</div>
          <h2>Choose your Roles and Specialities</h2>
          <p class="lede">This is the first page of the self-assessment questionnaire, not a separate Profile page. Select any combination, or none. These choices group relevant Skills but never restrict which Skills you can assess.</p>
          ${selectionControls()}
          <div class="inline-actions"><span class="small muted">${selectedRoles.length} Roles and ${selectedSpecialities.length} Specialities selected</span>
            <button class="btn" id="continue">${assessmentStarted ? "Save selections and return to assessment" : "Save selections and start assessment"}</button></div>
        </section>`;
      }

      function row(skill, page) {
        const assoc = otherAssociations(skill, `${page.kind}-${page.id}`);
        const chosen = assessments[skill.id] || "";
        return `<tr class="skill-row">
          <td><strong>${skill.name}</strong>${assoc.length ? `<span class="association">Also relevant to: ${assoc.join(", ")}</span>` : ""}</td>
          <td>${skill.description}<span class="association">${skill.domain}</span></td>
          <td><label class="small" for="level-${skill.id}-${page.key}">Your level</label>
            <select id="level-${skill.id}-${page.key}" data-level="${skill.id}" aria-label="Your level for ${skill.name}">
              ${levels.map((level, index) => `<option value="${index === 0 ? "" : index - 1}" ${String(index === 0 ? "" : index - 1) === chosen ? "selected" : ""}>${level || "Not assessed"}</option>`).join("")}
            </select></td>
        </tr>`;
      }

      function pageGroups(list) {
        const groups = [];
        list.forEach((page, index) => {
          let group = groups.find(item => item.key === page.groupKey);
          if (!group) {
            group = { key: page.groupKey, kind: page.kind, label: page.label, pages: [] };
            groups.push(group);
          }
          group.pages.push({ page, index });
        });
        return groups;
      }

      function groupType(kind) {
        return kind === "role" ? "Role" : kind === "speciality" ? "Speciality" : "Remaining Skills";
      }

      function renderGroupOutline(list, collapsible) {
        return `<nav class="card side-nav" aria-label="Assessment sections"><h3>Sections by selection</h3>
          ${pageGroups(list).map(group => {
            const active = group.pages.some(item => item.index === pageIndex);
            const heading = `<span class="group-parent"><small>${groupType(group.kind)}</small>${group.label}</span>`;
            const links = group.pages.map(item => `<button class="domain-link" data-page="${item.index}" ${item.index === pageIndex ? 'aria-current="page"' : ""}>${item.page.domain || "No mapped Skills"}${item.page.items.length === 0 ? `<small class="association">Empty selection</small>` : ""}</button>`).join("");
            return collapsible
              ? `<details ${active ? "open" : ""}><summary>${heading}</summary>${links}</details>`
              : `<div>${heading}${links}</div>`;
          }).join("")}
        </nav>`;
      }

      function renderGroupTabs(list) {
        const groups = pageGroups(list);
        const activeGroup = list[pageIndex].groupKey;
        const active = groups.find(group => group.key === activeGroup);
        return `<nav aria-label="Selection groups">
          <div class="group-tabs">${groups.map(group => `<button type="button" data-group="${group.key}" aria-current="${group.key === activeGroup}"><small>${groupType(group.kind)}:</small> ${group.label}</button>`).join("")}</div>
          <div class="small muted">Domains within ${groupType(active.kind)}: ${active.label}</div>
          <div class="domain-tabs" aria-label="Domains within current selection">${active.pages.map(item => `<button type="button" data-page="${item.index}" ${item.index === pageIndex ? 'aria-current="page"' : ""}>${item.page.domain || "No mapped Skills"}</button>`).join("")}</div>
        </nav>`;
      }

      function renderQuestionnaire(contentStyle) {
        const list = pages();
        pageIndex = Math.min(pageIndex, Math.max(0, list.length - 1));
        const current = list[pageIndex];
        const progress = `<div class="assessment-tools"><div><strong class="small">Questionnaire progress</strong>
          <div class="progress"><span style="width:${Math.round((pageIndex + 1) / list.length * 100)}%"></span></div>
          <span class="small muted">Section ${pageIndex + 1} of ${list.length}</span></div>
          <button class="btn secondary" id="edit-selections">Edit selections</button></div>`;
        const search = `<label class="small" for="skill-search">Filter Skills on this page</label>
          <input id="skill-search" type="search" value="${searchTerm}" placeholder="Search this page...">`;
        const matches = current.items.filter(skill => `${skill.name} ${skill.description}`.toLowerCase().includes(searchTerm.toLowerCase()));
        const body = `<section class="card"><p class="small muted">${groupType(current.kind)}: ${current.label}</p>
            <h2>${current.domain || "No mapped Skills"}</h2>
            <p class="small muted">This Domain is nested within the ${groupType(current.kind)} section above.</p>
            ${current.items.length === 0 ? `<div class="notice empty">No Skills are mapped to this selection yet. You can still assess every Skill from Remaining Skills.</div>` : ""}
            ${search}
            ${current.items.length ? `<div style="overflow-x:auto"><table class="skill-table"><thead><tr><th>Skill</th><th>Description</th><th>Level</th></tr></thead><tbody>${matches.map(skill => row(skill, current)).join("") || `<tr><td colspan="3" class="muted">No Skills match this filter. Clear it to see this page again.</td></tr>`}</tbody></table></div>` : ""}
            <div class="inline-actions"><button class="btn secondary" id="back" ${pageIndex === 0 ? "disabled" : ""}>Previous Domain</button>
              <span class="small muted">Changes save when you navigate; blank values leave saved levels unchanged.</span>
              <button class="btn" id="forward">${pageIndex === list.length - 1 ? "Finish" : "Next Domain"}</button></div>
            ${savedMessage ? `<div class="notice success" role="status">${savedMessage}</div>` : ""}
          </section>`;
        if (contentStyle === "a") {
          return `${progress}<div class="layout layout-a">${renderGroupOutline(list, true)}${body}</div>`;
        }
        if (contentStyle === "b") {
          return `${progress}<div class="layout layout-b">${renderGroupOutline(list, false)}${body}</div>`;
        }
        return `${progress}<div class="layout layout-c">${renderGroupTabs(list)}${body}</div>`;
      }

      function render() {
        const content = pageIndex === -1
          ? renderSelectionScreen()
          : renderQuestionnaire(variant.toLowerCase());
        reviewTools.innerHTML = renderReviewTools();
        app.innerHTML = `<div class="page-title"><div><h1 class="page-heading">Self-assessment questionnaire</h1><p class="lede">Selections guide the order of this questionnaire. They do not limit which Skills can be assessed.</p></div></div>
          ${content}
          <p class="footer-note">Illustrative screen only. No selections or assessments are saved.</p>`;
        document.querySelector("#variant-label").textContent = `Layout ${variant}: ${variantNames[variant]}`;
        bind();
      }

      function bind() {
        document.querySelector("#scenario").addEventListener("change", event => setScenario(event.target.value));
        document.querySelectorAll("[data-variant]").forEach(button => button.addEventListener("click", () => {
          variant = button.dataset.variant;
          params.set("variant", variant);
          history.replaceState(null, "", `${location.pathname}?${params.toString()}`);
          render();
        }));
        document.querySelectorAll("[data-choice]").forEach(input => input.addEventListener("change", () => {
          const selected = input.dataset.choice === "role" ? selectedRoles : selectedSpecialities;
          const updated = input.checked ? [...selected, input.value] : selected.filter(id => id !== input.value);
          if (input.dataset.choice === "role") selectedRoles = updated;
          else selectedSpecialities = updated;
          render();
        }));
        document.querySelector("#continue")?.addEventListener("click", () => {
          pageIndex = assessmentStarted ? returnPageIndex : 0;
          assessmentStarted = true;
          savedMessage = "Selections saved in prototype memory.";
          render();
        });
        document.querySelector("#edit-selections")?.addEventListener("click", () => {
          returnPageIndex = pageIndex;
          pageIndex = -1;
          render();
        });
        document.querySelectorAll("[data-page]").forEach(button => button.addEventListener("click", () => {
          pageIndex = Number(button.dataset.page);
          assessmentStarted = true;
          savedMessage = "Page changed. Shared Skill levels remain visible wherever a Skill appears.";
          render();
        }));
        document.querySelectorAll("[data-group]").forEach(button => button.addEventListener("click", () => {
          pageIndex = pages().findIndex(page => page.groupKey === button.dataset.group);
          assessmentStarted = true;
          savedMessage = "Selection group changed; the Domain page stays nested within that group.";
          render();
        }));
        document.querySelector("#back")?.addEventListener("click", () => {
          pageIndex = Math.max(0, pageIndex - 1);
          savedMessage = "Previous page opened; saved levels are preserved.";
          render();
        });
        document.querySelector("#forward")?.addEventListener("click", () => {
          const last = pages().length - 1;
          if (pageIndex < last) pageIndex += 1;
          savedMessage = pageIndex === last ? "Assessment sections complete; you can revisit any group." : "Current Domain saved in prototype memory.";
          render();
        });
        document.querySelector("#skill-search")?.addEventListener("input", event => {
          searchTerm = event.target.value;
          const active = event.target.selectionStart;
          render();
          const replacement = document.querySelector("#skill-search");
          replacement.focus();
          replacement.setSelectionRange(active, active);
        });
        document.querySelectorAll("[data-level]").forEach(input => input.addEventListener("change", () => {
          if (input.value !== "") assessments[input.dataset.level] = input.value;
          savedMessage = "Edit held until you navigate; selecting Not assessed does not erase an existing level.";
          render();
        }));
      }

      function changeVariant(direction) {
        const variants = ["A", "B", "C"];
        variant = variants[(variants.indexOf(variant) + direction + variants.length) % variants.length];
        params.set("variant", variant);
        history.replaceState(null, "", `${location.pathname}?${params.toString()}`);
        render();
      }
      document.querySelector("#previous").addEventListener("click", () => changeVariant(-1));
      document.querySelector("#next").addEventListener("click", () => changeVariant(1));
      document.addEventListener("keydown", event => {
        if (["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement.tagName) || document.activeElement.isContentEditable) return;
        if (event.key === "ArrowLeft") changeVariant(-1);
        if (event.key === "ArrowRight") changeVariant(1);
      });
      render();
        </script>
    </body>
</html>
